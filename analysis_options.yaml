include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - "**/*.freezed.dart"
    - "**/*.g.dart"
    - web/**
  errors:
    # Generated code is not committed, so a missing part file before build_runner runs is
    # expected noise rather than a real error.
    uri_has_not_been_generated: ignore
    # These are bugs waiting to happen in a data-heavy app; fail the analyzer on them.
    invalid_annotation_target: ignore
    unused_import: error
    unused_local_variable: error
    dead_code: error
  language:
    strict-casts: true
    strict-raw-types: true


linter:
  rules:
    # A jewellery spec is full of near-identical numeric fields; named arguments and const
    # constructors are what keep the call sites readable.
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_empty_else
    - avoid_relative_lib_imports
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sort_child_properties_last
    - unawaited_futures
    - use_build_context_synchronously
    # Money is an integer count of minor units (see lib/core/money.dart); a stray double
    # literal in a price path is exactly the bug this catches.
    - avoid_double_and_int_checks
