# Flutter's template ships -Xmx8G -XX:MaxMetaspaceSize=4G, which asks for 12 GB. On a 16 GB
# machine that is already running an IDE and a Gradle daemon there is not that much free, so
# the Kotlin compile daemon gets killed mid-run. It then fails to close its incremental caches
# and the next build dies on a corrupted .tab file rather than on anything to do with the code.
# These values build this project comfortably; raise them on a bigger machine if you like.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=384m -XX:+HeapDumpOnOutOfMemoryError

# The Kotlin daemon gets its own heap. Left unset it inherits the Gradle args above and
# doubles the footprint.
kotlin.daemon.jvmargs=-Xmx1536m

# Kotlin incremental compilation is off because it does not survive on this platform: every
# plugin module (image_picker_android, url_launcher_android, shared_preferences_android,
# record_android) failed with
#   Could not close incremental caches in .../caches-jvm/jvm/kotlin:
#   class-fq-name-to-source.tab, source-to-classes.tab, internal-name-to-source.tab
# on a freshly cleaned build tree, so it was not stale state — the caches fail to close as
# they are written, which is the classic signature of a file scanner holding them open on
# Windows. Turning it off removes the caches entirely. The cost is full recompiles of the
# plugin modules, which are small; the app's own Kotlin is one file.
# If you build on Linux or macOS, deleting this line is safe and will be faster.
kotlin.incremental=false

# Four cores here, and the Kotlin and Dart compiles already saturate them. Parallel project
# execution mostly adds memory pressure on a single-module app.
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.daemon=true

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
