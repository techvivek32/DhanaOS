name: dhanaos
description: Manufacturing operations for a bespoke jewellery workshop.
publish_to: none
version: 0.2.0+2

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # state
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # routing — declarative, role-guarded (D-008)
  go_router: ^14.2.0

  # backend (D-007)
  supabase_flutter: ^2.5.6

  # models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # formatting — INR/USD, dates (D-004)
  intl: ^0.19.0

  # capture: the intake wizard's media step (D-011 rule 4)
  image_picker: ^1.1.2
  # Must be >=13: file_picker 8.x compiles against android-34, while
  # flutter_plugin_android_lifecycle (pulled in by image_picker) requires every dependant to
  # compile against 36+. The build fails at :file_picker:checkDebugAarMetadata, which reads as
  # a minSdk problem but is about compileSdk.
  file_picker: ^13.0.0
  # Must be >=7: record 5.x resolves record_linux 0.7.2 against
  # record_platform_interface 1.6.0, whose hasPermission/startStream signatures it does not
  # implement. Dart compiles every federated implementation even for an Android-only build,
  # so that mismatch fails the APK compile rather than being ignored.
  record: ^7.1.1
  # 0.9.x (and the audio_session it pulls) compile against android-34 and hit the same
  # checkDebugAarMetadata failure as file_picker did.
  just_audio: ^0.10.6
  path_provider: ^2.1.4

  # ui
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1

  # utility
  collection: ^1.18.0
  # The admin panel's light / dark choice, kept in the browser (localStorage on the web).
  shared_preferences: ^2.5.5
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Codegen runs on the analyzer, and the analyzer must understand the SDK's own syntax: the
  # Riverpod 2 / freezed 2 generators were capped at analyzer 7, which cannot read the dot
  # shorthands Flutter 3.47's framework is written in ("Missing implementation of
  # visitDotShorthandPropertyAccess"), so nothing generated. riverpod_lint moved to the new
  # analysis_server_plugin system in 3.x and is left out until it is wired up there.
  build_runner: ^2.16.1
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  riverpod_generator: ^4.0.9

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
